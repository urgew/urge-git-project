name: Continuous Deployment via AWX

on:
  push:
    branches:
      - main

jobs:
  deploy-via-awx:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Sync AWX Project from GitHub
      - name: Sync AWX Project Source Code
        run: |
          echo "Starting AWX project synchronization..."

          curl -k -f -X POST \
            -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.AWX_HOST }}/api/v2/projects/${{ secrets.AWX_PROJECT_ID }}/update/"

          echo "AWX project sync requested successfully."

      # Step 2: Wait for AWX project synchronization
      - name: Wait for AWX Project Sync
        run: |
          echo "Waiting for AWX project synchronization..."
          sleep 15

      # Step 3: Launch AWX Job Template
      - name: Launch AWX Deployment Job Template
        run: |
          echo "Launching AWX deployment job template..."

          curl -k -f -X POST \
            -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.AWX_HOST }}/api/v2/job_templates/${{ secrets.AWX_JOB_TEMPLATE_ID }}/launch/"

          echo "AWX deployment job launched successfully."