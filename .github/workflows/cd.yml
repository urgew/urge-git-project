name: Continuous Deployment via AWX

on:
  push:
    branches:
      - main

jobs:
  deploy-via-awx:
    runs-on: ubuntu-latest

    steps:

      # Check GitHub Secrets
      - name: Check AWX configuration
        run: |
          echo "Checking AWX configuration..."

          if [ -z "${{ secrets.AWX_HOST }}" ]; then
            echo "ERROR: AWX_HOST is empty or not configured."
            exit 1
          fi

          if [ -z "${{ secrets.AWX_TOKEN }}" ]; then
            echo "ERROR: AWX_TOKEN is empty or not configured."
            exit 1
          fi

          if [ -z "${{ secrets.AWX_PROJECT_ID }}" ]; then
            echo "ERROR: AWX_PROJECT_ID is empty or not configured."
            exit 1
          fi

          if [ -z "${{ secrets.AWX_JOB_TEMPLATE_ID }}" ]; then
            echo "ERROR: AWX_JOB_TEMPLATE_ID is empty or not configured."
            exit 1
          fi

          echo "AWX_HOST is configured."
          echo "AWX_PROJECT_ID is configured."
          echo "AWX_JOB_TEMPLATE_ID is configured."
          echo "AWX_TOKEN is configured."

      # Sync AWX Project
      - name: Sync AWX Project Source Code
        run: |
          echo "Starting AWX project synchronization..."

          curl -k -f -X POST \
            -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.AWX_HOST }}/api/v2/projects/${{ secrets.AWX_PROJECT_ID }}/update/"

          echo "AWX project sync requested successfully."

      # Wait
      - name: Wait for AWX project synchronization
        run: |
          echo "Waiting for AWX project synchronization..."
          sleep 15

      # Launch AWX Job Template
      - name: Launch AWX Deployment Job Template
        run: |
          echo "Launching AWX deployment job template..."

          curl -k -f -X POST \
            -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.AWX_HOST }}/api/v2/job_templates/${{ secrets.AWX_JOB_TEMPLATE_ID }}/launch/"

          echo "AWX deployment job launched successfully."