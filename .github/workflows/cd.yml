name: Continuous Deployment via AWX

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-via-awx:
    runs-on: self-hosted

    steps:
    # Step 1: Tell AWX to pull down your new repository code
    - name: Sync AWX Project Source Code
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
          -H "Content-Type: application/json" \
          -k \
          "${{ secrets.AWX_HOST }}/api/v2/projects/${{ secrets.AWX_PROJECT_ID }}/update/"

    # Step 2: Wait for the project sync to finish
    - name: Wait for Sync
      run: sleep 10

    # Step 3: Trigger Template ID 20 directly using a clean API string
    - name: Launch AWX Deployment Job Template
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.AWX_TOKEN }}" \
          -H "Content-Type: application/json" \
          -k \
          "${{ secrets.AWX_HOST }}/api/v2/job_templates/20/launch/"
